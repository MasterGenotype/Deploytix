# Build configuration
#
# GCC (glibc, dynamically linked):
#   cargo gcc-build         (alias below)
#   make gcc                (via Makefile)
#
# There is no static musl build: the CLI links libasound for theme audio
# (rodio), and there is no static ALSA to link against, so a fully
# self-contained binary is not achievable. Build for glibc.

[target.x86_64-unknown-linux-gnu]
linker = "gcc"

[build]
# Uncomment to set a default target
# target = "x86_64-unknown-linux-gnu"

[alias]
# GCC / glibc build (dynamically linked)
gcc-build = "build --release --target x86_64-unknown-linux-gnu --bin deploytix"
