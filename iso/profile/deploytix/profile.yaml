---

live-session:
  user: artix
  password: artix
  autologin: true
  use-xlibre: false
  services:
    - acpid
    - bluetoothd
    - cronie
    - cupsd
    - syslog-ng
    - NetworkManager
    # Compressed RAM swap. The live COW layer is tmpfs-backed on every boot mode
    # except a stick written by write-deploytix-usb.sh, so without this the
    # session has no memory backstop at all. Service files for all four inits
    # live in root-overlay; the worker is /usr/local/bin/deploytix-zram-swap.
    - zram
  user-services:
    - dbus
rootfs:
  packages:
    - mkinitcpio-nfs-utils
    - squashfs-tools
    - artix-grub-live
  packages-init:
    dinit:
      - dinit-user-spawn
      - syslog-ng-dinit
      - networkmanager-dinit
      - cups-dinit
      - artix-live-dinit
    openrc:
      - syslog-ng-openrc
      - networkmanager-openrc
      - cups-openrc
      - artix-live-openrc
    runit:
      - syslog-ng-runit
      - networkmanager-runit
      - cups-runit
      - artix-live-runit
    s6:
      - syslog-ng-s6
      - networkmanager-s6
      - cups-s6
      - artix-live-s6
livefs:
  packages:
    - deploytix-git
    - tkg-gui-git
    - gamescope-git
    - dosfstools
    # artools + its profile trees and YAML parser, so the live medium can run
    # buildiso itself rather than only being a product of it. Upstream split
    # artools into three: -base (basestrap, artix-chroot — what deploytix
    # calls), -pkg (package building) and -iso (buildiso).
    - artools-base
    - artools-pkg
    - artools-iso
    - iso-profiles
    - go-yq
    # xset: deploytix turns the X screensaver and DPMS off for the length of an
    # install (src/utils/idle.rs). Without it the GUI blanks mid-basestrap.
    - xorg-xset
