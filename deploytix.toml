# Reference deployment config — tracked in git, so it must never contain
# real credentials.  Keep working credentials in `deploytix.local.toml`
# (gitignored) and install with:
#
#     deploytix install -c deploytix.local.toml
#
# Configs written by `deploytix generate-config` and by the GUI's Save
# button are created mode 0600 because they carry secrets in cleartext.

[disk]
device = "/dev/sdb"
filesystem = "btrfs"
boot_filesystem = "btrfs"
encryption = true
encryption_password = "CHANGE-ME-BEFORE-USE"
luks_mapper_name = "Crypt-Root"
boot_encryption = false
luks_boot_mapper_name = "Crypt-Boot"
integrity = false
keyfile_enabled = true
use_subvolumes = true
use_lvm_thin = false
lvm_vg_name = "vg0"
lvm_thin_pool_name = "thinpool"
lvm_thin_pool_percent = 95
swap_type = "zramonly"
swap_file_size_mib = 0
zram_algorithm = "zstd"

[[disk.partitions]]
mount_point = "/"
size_mib = 46080

[[disk.partitions]]
mount_point = "/usr"
size_mib = 66560

[[disk.partitions]]
mount_point = "/var"
size_mib = 40960

[[disk.partitions]]
mount_point = "/home"
size_mib = 0

[system]
init = "runit"
bootloader = "grub"
timezone = "America/Vancouver"
locale = "en_US.UTF-8"
keymap = "us"
hostname = "artix"
hibernation = false
secureboot = false
secureboot_method = "sbctl"

[user]
name = "superphenotype"
password = "CHANGE-ME-BEFORE-USE"
groups = [
    "wheel",
    "video",
    "audio",
    "input",
    "render",
    "network",
    "log",
    "seat",
]
sudoer = true

[network]
backend = "networkmanager"

[desktop]
environment = "kde"

[packages]
install_yay = true
install_wine = true
install_gaming = true
install_session_switching = true
install_btrfs_tools = true
install_grub_btrfs = true
sysctl_gaming_tweaks = true
sysctl_network_performance = true
install_hhd = true
install_decky_loader = true
install_evdevhook2 = true
gpu_drivers = ["amd"]
