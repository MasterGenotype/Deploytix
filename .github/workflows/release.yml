name: Release

on:
  push:
    tags:
      - "v*"
    branches:
      # Cargo.toml is the source of truth: a push to main whose version has no
      # matching tag yet cuts that release automatically. Pushes that do not
      # change the version stop at the resolve job and release nothing.
      - "main"
      # Pushing a release/vX.Y.Z branch cuts release vX.Y.Z at that commit,
      # for environments that cannot push tags directly.
      - "release/v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create (e.g. v1.4.0)"
        required: true
        type: string

permissions:
  contents: write

# One release at a time. Two runs racing here would force the same tag to two
# different commits and publish whichever finished last.
concurrency:
  group: release-${{ github.workflow }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  meta:
    name: Resolve release
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      release: ${{ steps.resolve.outputs.release }}
    steps:
      - uses: actions/checkout@v4
      - name: Resolve tag and decide whether to release
        id: resolve
        run: |
          set -euo pipefail

          crate="$(sed -n '/^\[package\]/,/^\[/s/^version *= *"\(.*\)"/\1/p' Cargo.toml | head -1)"
          if [ -z "$crate" ]; then
            echo "::error::Could not read the package version from Cargo.toml"
            exit 1
          fi

          if [ -n "${{ inputs.tag }}" ]; then
            tag="${{ inputs.tag }}"; source="workflow_dispatch"
          elif [ "$GITHUB_REF_TYPE" = "tag" ]; then
            tag="$GITHUB_REF_NAME"; source="tag push"
          elif [ "$GITHUB_REF_NAME" != "${GITHUB_REF_NAME#release/}" ]; then
            tag="${GITHUB_REF_NAME#release/}"; source="release branch"
          else
            tag="v$crate"; source="main push"
          fi

          case "$tag" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "::error::Release tag '$tag' is not vMAJOR.MINOR.PATCH"; exit 1 ;;
          esac

          # The version is compiled into the binaries (clap reads
          # CARGO_PKG_VERSION), so a tag that disagrees with Cargo.toml
          # publishes vX binaries that report vY. Trivially true for a main
          # push, where the tag is derived from Cargo.toml.
          if [ "$tag" != "v$crate" ]; then
            echo "::error::Tag $tag does not match Cargo.toml version $crate."
            echo "::error::Bump the version in Cargo.toml (and Cargo.lock) or retag as v$crate."
            exit 1
          fi

          # A main push only releases a version that has no tag yet, so
          # ordinary pushes are silent and re-running one cannot republish.
          # An explicit tag/branch/dispatch is always an intentional release.
          if [ "$source" = "main push" ] \
             && git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
            release=false
            echo "$tag is already tagged; nothing to release." >> "$GITHUB_STEP_SUMMARY"
          else
            release=true
            echo "Releasing **$tag** (trigger: $source)." >> "$GITHUB_STEP_SUMMARY"
          fi

          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "release=$release" >> "$GITHUB_OUTPUT"

  lint:
    name: Lint and test
    needs: meta
    if: needs.meta.outputs.release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      # --all-features pulls the egui GUI into the library, so the test
      # binaries link eframe and need its X11/Wayland deps, not just ALSA.
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxkbcommon-dev libwayland-dev libgl-dev
      - run: cargo fmt -- --check
      - run: cargo clippy --all-features -- -D warnings
      - run: cargo test --all-features

  build-cli:
    name: Build CLI binary
    needs: [meta, lint]
    if: needs.meta.outputs.release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # The CLI links libasound (theme audio), which has no static musl
      # build on the runners, so a fully static musl binary is not possible.
      - name: Install ALSA headers
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      # Built without the gui feature so the CLI carries no egui dependency.
      # deploytix-rehearsal is deliberately not released: it is a build-tree
      # tool and is not packaged either (see BUILD.md, Packaging).
      - name: Build CLI binary
        run: cargo build --release --bin deploytix
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: deploytix-x86_64-linux-gnu
          path: target/release/deploytix
          if-no-files-found: error

  build-gui:
    name: Build GUI binaries
    needs: [meta, lint]
    if: needs.meta.outputs.release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install GUI dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxkbcommon-dev libwayland-dev libgl-dev
      # Both GUI binaries ship as packages (deploytix-gui-git and
      # deploytix-update-gui-git), so both belong in the release.
      - name: Build GUI binaries
        run: cargo build --release --features gui --bin deploytix-gui --bin deploytix-update-gui
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: deploytix-gui-x86_64-linux-gnu
          path: |
            target/release/deploytix-gui
            target/release/deploytix-update-gui
          if-no-files-found: error

  release:
    name: Publish release
    needs: [meta, build-cli, build-gui]
    if: needs.meta.outputs.release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download CLI artifact
        uses: actions/download-artifact@v4
        with:
          name: deploytix-x86_64-linux-gnu
          path: artifacts/
      - name: Download GUI artifacts
        uses: actions/download-artifact@v4
        with:
          name: deploytix-gui-x86_64-linux-gnu
          path: artifacts/
      # upload-artifact does not preserve the executable bit.
      - name: Prepare release assets
        working-directory: artifacts
        run: |
          chmod +x deploytix deploytix-gui deploytix-update-gui
          sha256sum deploytix deploytix-gui deploytix-update-gui > SHA256SUMS
          cat SHA256SUMS
      # action-gh-release never moves an existing tag, so force the tag to
      # the built commit ourselves. No-op for tag-push runs (same commit);
      # for release-branch runs this keeps tag, source, and binaries in sync.
      - name: Point tag at built commit
        run: |
          TAG="${{ needs.meta.outputs.tag }}"
          git tag -f "$TAG" "$GITHUB_SHA"
          git push -f origin "refs/tags/$TAG:refs/tags/$TAG"
      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          # Tag pushes release ref_name as-is; release/vX.Y.Z branch pushes
          # and workflow_dispatch create the tag at the built commit.
          # Without target_commitish a new tag lands on the default branch
          # HEAD instead of the commit the binaries were built from.
          tag_name: ${{ needs.meta.outputs.tag }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            artifacts/deploytix
            artifacts/deploytix-gui
            artifacts/deploytix-update-gui
            artifacts/SHA256SUMS
