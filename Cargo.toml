[workspace]
# vendor/ holds the tkg-gui and gamescope submodules. tkg-gui is a Rust crate,
# and makepkg builds it from a clone at vendor/tkg-gui/pkg/src/tkg-gui — inside
# this directory tree. Cargo walks up from there, finds this [workspace], and
# refuses the build ("believes it's in a workspace when it's not") unless the
# path is either a member or excluded. It must be *excluded*: that clone is
# makepkg scratch (gitignored upstream, and wiped by
# iso/build-deploytix-iso.sh before every build), so making it a member breaks
# `cargo` at the root the moment it is absent — on a fresh clone, and after
# each ISO build. Note that excluding is only effective from outside a member:
# an exclude beneath vendor/tkg-gui would be ignored if that were a member too.
members = ["crates/pkgdeps"]
exclude = ["vendor"]

[package]
name = "deploytix"
version = "1.5.2"
edition = "2021"
authors = ["superphenotype"]
description = "Automated Artix Linux deployment installer for removable media and disks"
license = "GPL-3.0-or-later"
repository = "https://github.com/MasterGenotype/Deploytix"
keywords = ["linux", "installer", "artix", "deployment"]
categories = ["command-line-utilities", "filesystem"]

[dependencies]
# CLI
clap = { version = "4", features = ["derive", "env"] }
dialoguer = { version = "0.11", features = ["fuzzy-select"] }
console = "0.15"
indicatif = "0.17"
colored = "2"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

# System
nix = { version = "0.29", features = ["fs", "mount", "process", "signal", "user"] }
libc = "0.2"
uuid = { version = "1", features = ["v4"] }

# Error handling
thiserror = "2"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Audio
rodio = { version = "0.19", default-features = false, features = ["wav"] }

# Dependency resolution and package queries — its own crate so it can carry
# its own tests and release cadence (see docs/REFACTOR_PLAN.md phase 9).
pkgdeps = { path = "crates/pkgdeps" }

# Misc
regex = "1"
once_cell = "1"
# Ranking AUR search results against what the user typed. Already in the tree
# as a transitive dependency of dialoguer's fuzzy-select, so this pulls in
# nothing new.
fuzzy-matcher = "0.3"

# GUI (optional)
eframe = { version = "0.31", optional = true, default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }
egui = { version = "0.31", optional = true }

[features]
default = []
gui = ["dep:eframe", "dep:egui"]

[[bin]]
name = "deploytix"
path = "src/main.rs"

[[bin]]
name = "deploytix-gui"
path = "src/gui_main.rs"
required-features = ["gui"]

[[bin]]
name = "deploytix-update-gui"
path = "src/update_gui_main.rs"
required-features = ["gui"]

[[bin]]
name = "deploytix-rehearsal"
path = "src-rehearsal/main.rs"

[build-dependencies]
cc = "1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
